name: Import workout data

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-workout-import
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check database credential
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing GitHub Actions secret: DATABASE_URL"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply pending database migrations
        run: npm run db:migrate:deploy

      - name: Import and verify workout snapshot
        run: npm run db:import:workout-json:apply
