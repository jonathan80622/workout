name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check deployment credentials
        shell: bash
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test production environment handling
        run: node --test scripts/prepare-production-env.test.mjs

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production environment from Vercel
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Validate and mask production environment
        run: node scripts/prepare-production-env.mjs

      - name: Build production app
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Migrate and verify production database
        run: node --env-file=.vercel/.env.production.local scripts/deploy-database.mjs

      - name: Deploy verified build
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Remove downloaded environment
        if: always()
        run: |
          node -e "require('node:fs').rmSync('.vercel/.env.production.local', { force: true })"
