name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check deployment credentials
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID DATABASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test production environment handling
        run: node --test scripts/prepare-production-env.test.mjs

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Validate production migration environment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/prepare-production-env.mjs

      - name: Migrate and verify production database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/deploy-database.mjs

      - name: Deploy production from source
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
