name: Link account to workout data

on:
  workflow_dispatch:
    inputs:
      email:
        description: Google account email that has already signed in to the site
        required: true
      owner:
        description: auth_subject of the data owner to link
        required: true
        default: legacy-import:workout-data
      apply:
        description: Write the link (unchecked = dry run)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  link:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ACCOUNT_EMAIL: ${{ inputs.email }}
      OWNER_AUTH_SUBJECT: ${{ inputs.owner }}
      APPLY_FLAG: ${{ inputs.apply && '--apply' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Link account
        run: node scripts/link-owner-account.mjs --email "$ACCOUNT_EMAIL" --owner "$OWNER_AUTH_SUBJECT" $APPLY_FLAG
