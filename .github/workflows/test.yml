name: Test

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: analytics-test
          POSTGRES_DB: analytics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:analytics-test@localhost:5432/analytics_test
      ANALYTICS_TEST_DATABASE_URL: postgresql://postgres:analytics-test@localhost:5432/analytics_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Historical identity migration requires production data; this database is disposable.
      - run: npx prisma db push
      - run: node --test scripts/*.test.cjs scripts/*.test.mjs
      - run: npx tsc --noEmit --incremental false
      - run: npm run build
